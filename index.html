<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repaso AWS Cloud Practitioner (CLF-C02)</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#5d6670; --line:#e3e6ea;
  --accent:#e47911; --accent-soft:#fff3e6; --ok:#1f8a4c; --ok-soft:#e6f5ec; --bad:#c0392b; --bad-soft:#fdecea;
  --chip:#eef0f3;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1216; --card:#181c22; --text:#e7eaee; --muted:#9aa4ae; --line:#2a3038;
    --accent:#ff9a3c; --accent-soft:#2b2116; --ok:#4cc782; --ok-soft:#17291f; --bad:#ff7a6b; --bad-soft:#2d1a18; --chip:#232830; }
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:12px 0 6px;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1;min-width:220px}
h1 small{color:var(--muted);font-weight:500}
.progress{font-size:13px;color:var(--muted)}
.bar{height:6px;width:140px;background:var(--chip);border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav button{border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent-soft);color:var(--accent)}
main{padding:18px 0 60px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input[type=search]{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
label.toggle{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
h2{font-size:16px;margin:22px 0 10px;display:flex;gap:8px;align-items:center}
h2 .count{font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative}
.svc.done{opacity:.55}
.svc h3{font-size:15px;margin:0 0 4px;padding-right:34px}
.svc p{margin:0;color:var(--text);font-size:14px}
.svc .hint{margin-top:8px;font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding-left:8px}
.svc .hint b{color:var(--accent)}
.check{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ok);font-weight:700}
.svc.done .check{background:var(--ok-soft);border-color:var(--ok)}
.concept{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.concept summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none}
.concept summary::before{content:"▸ ";color:var(--accent)}
.concept[open] summary::before{content:"▾ "}
.concept .body{padding:0 16px 12px}
.concept ul,.concept ol{padding-left:20px;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--chip);font-weight:700}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;overflow-x:auto}
.cmp h3{margin:0 0 8px;font-size:15px}
.cmp .note{font-size:13px;color:var(--muted);margin:8px 0 0}
.cmp td:first-child{font-weight:600;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.flash{max-width:620px;margin:10px auto}
.card{perspective:1200px;cursor:pointer;height:280px}
.card .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.face .lbl{position:absolute;top:12px;left:16px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.face.back{transform:rotateY(180deg);border-color:var(--accent)}
.face .q{font-size:19px;font-weight:600}
.face .a{font-size:22px;font-weight:800;color:var(--accent)}
.face .d{font-size:14px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.meta{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.quiz{max-width:680px;margin:10px auto}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.qbox .q{font-size:18px;font-weight:600;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.explain{margin-top:10px;font-size:14px;color:var(--muted)}
.score{font-size:14px;color:var(--muted);text-align:center;margin-bottom:10px}
select{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.empty{color:var(--muted);text-align:center;padding:30px}
@media (max-width:640px){
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chip{white-space:nowrap}
  .grid{grid-template-columns:1fr}
  .card{height:300px}
}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:3px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>☁️ Repaso AWS Cloud Practitioner <small>CLF-C02</small></h1>
      <div class="progress">Dominados: <span id="prog">0/0</span><span class="bar"><i id="progbar"></i></span></div>
    </div>
    <nav id="tabs">
      <button data-tab="conceptos">📘 Conceptos</button>
      <button data-tab="servicios" class="on">🧩 Servicios</button>
      <button data-tab="comparaciones">⚖️ Se confunden</button>
      <button data-tab="flash">🃏 Flashcards</button>
      <button data-tab="quiz">✅ Quiz</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>Resumen personal de estudio basado en la guía de Tutorials Dojo y la documentación de AWS. El progreso se guarda solo en este navegador.</footer>

 ["El examen (CLF-C02)", `<ul><li>65 preguntas · 90 min · aprueba con <b>700/1000</b> · 100 USD.</li><li>Dominios: <b>Conceptos de la nube 24%</b> · <b>Seguridad y cumplimiento 30%</b> · <b>Tecnología y servicios 34%</b> · <b>Facturación, precios y soporte 12%</b>.</li><li>No penaliza adivinar: nunca dejes preguntas en blanco.</li><li>Si piden "lo más costo-efectivo", primero debe <i>cumplir el requisito</i>; luego ser barato.</li></ul>`],
 ["6 ventajas de la nube", `<ol><li>Cambiar gasto de capital (<b>CAPEX</b>) por gasto variable (<b>OPEX</b>).</li><li>Beneficiarse de <b>economías de escala</b> masivas (precios más bajos).</li><li>Dejar de <b>adivinar la capacidad</b>.</li><li>Aumentar <b>velocidad y agilidad</b>.</li><li>Dejar de gastar en operar y mantener <b>centros de datos</b>.</li><li>Volverse <b>global en minutos</b>.</li></ol>`],
 ["Infraestructura global", `<ul><li><b>Región</b>: zona geográfica con varias AZ aisladas. Se elige según: cumplimiento/residencia de datos, latencia, servicios disponibles y precio.</li><li><b>Availability Zone (AZ)</b>: uno o más centros de datos con energía y red redundantes. Alta disponibilidad = usar <b>varias AZ</b>.</li><li><b>Edge Locations</b>: puntos de presencia para CloudFront, Route 53, Global Accelerator (caché cerca del usuario).</li><li><b>Local Zones</b> (latencia baja en ciudades), <b>Wavelength</b> (5G), <b>Outposts</b> (en tu data center).</li><li>Servicios <b>globales</b>: IAM, Route 53, CloudFront, WAF (en CloudFront), Organizations.</li></ul>`],
 ["Modelo de responsabilidad compartida", `<ul><li><b>AWS = seguridad DE la nube</b>: hardware, instalaciones físicas, red global, hipervisor, infraestructura de los servicios administrados.</li><li><b>Cliente = seguridad EN la nube</b>: datos, IAM (usuarios, permisos), SO invitado y parches en EC2, configuración de Security Groups, cifrado, configuración de la app.</li><li><b>Compartidos</b>: gestión de parches (AWS parchea la infraestructura, tú el SO invitado), gestión de configuración, concienciación y formación.</li><li>Cuanto más administrado el servicio (Lambda, DynamoDB, S3), <b>menos</b> responsabilidad para el cliente. En EC2 el cliente hace más; en RDS AWS parchea el motor de BD.</li></ul>`],
 ["Well-Architected Framework (6 pilares)", `<ol><li><b>Excelencia operativa</b>: operar y monitorear; IaC, cambios pequeños y reversibles.</li><li><b>Seguridad</b>: proteger datos y sistemas; mínimo privilegio, trazabilidad, cifrado.</li><li><b>Fiabilidad</b>: recuperarse de fallos, escalar; multi-AZ, recuperación automática.</li><li><b>Eficiencia del rendimiento</b>: usar recursos de forma eficiente; serverless, globalizar en minutos.</li><li><b>Optimización de costos</b>: evitar gastos innecesarios; pagar por uso, rightsizing.</li><li><b>Sostenibilidad</b>: minimizar el impacto ambiental.</li></ol><p>Principios de diseño: diseñar para fallos, desacoplar componentes (<i>loose coupling</i>), elasticidad, pensar en paralelo.</p>`],
 ["Cloud Adoption Framework (CAF)", `<p><b>6 perspectivas</b>:</p><ul><li>Negocio: <b>Business</b> (inversión en la nube acelera la transformación del negocio), <b>People</b> (cultura, talento, cambio organizacional), <b>Governance</b> (riesgos, beneficios, costo).</li><li>Técnicas: <b>Platform</b> (arquitectura e infraestructura), <b>Security</b> (confidencialidad, integridad, disponibilidad), <b>Operations</b> (servicios en la nube a niveles acordados).</li></ul><p><b>4 fases</b>: Envision → Align → Launch → Scale.</p><p>Beneficios: reducir riesgo de negocio, mejorar ESG, aumentar ingresos y eficiencia operativa.</p>`],
 ["Modelos de cómputo y despliegue", `<ul><li><b>IaaS</b> (EC2) · <b>PaaS</b> (Elastic Beanstalk) · <b>SaaS</b> (WorkSpaces, Gmail).</li><li>Despliegue: <b>Nube</b> (todo en AWS), <b>Híbrido</b> (nube + on-premises), <b>On-premises/privado</b>.</li><li>Formas de acceder: Consola, CLI, SDK, APIs, IaC (CloudFormation).</li><li>Escalado <b>vertical</b> (instancia más grande) vs <b>horizontal</b> (más instancias). Elasticidad = ajustar automáticamente a la demanda.</li></ul>`],
 ["Estrategias de migración (7 R)", `<ul><li><b>Rehost</b> (lift-and-shift, MGN) · <b>Replatform</b> (lift-tinker-shift, p. ej. a RDS) · <b>Refactor/Re-architect</b> (rediseñar, serverless) · <b>Repurchase</b> (cambiar a SaaS) · <b>Retain</b> (dejar on-premises) · <b>Retire</b> (apagar) · <b>Relocate</b> (mover VMware a AWS).</li></ul>`],
 ["Opciones de compra de EC2", `<ul><li><b>On-Demand</b>: pago por segundo/hora, sin compromiso. Cargas cortas, impredecibles.</li><li><b>Reserved Instances</b>: compromiso de 1 o 3 años, hasta ~72% de descuento. <b>Standard</b> (mayor descuento) vs <b>Convertible</b> (puedes cambiar familia, SO, tenancy). Pago: All Upfront (más barato) &gt; Partial &gt; No Upfront.</li><li><b>Savings Plans</b>: compromiso de $/hora por 1 o 3 años. <b>Compute SP</b> (más flexible: EC2, Fargate, Lambda, hasta 66%) · <b>EC2 Instance SP</b> (hasta 72%, una familia en una región).</li><li><b>Spot</b>: capacidad sobrante, hasta <b>90%</b> de descuento, AWS puede interrumpirla con 2 min de aviso. Cargas tolerantes a fallos y flexibles.</li><li><b>Dedicated Host</b>: servidor físico completo para ti; para <b>licencias por socket/núcleo</b> (BYOL) y cumplimiento.</li><li><b>Dedicated Instance</b>: hardware no compartido con otros clientes, pero sin visibilidad del host.</li><li><b>Capacity Reservations</b>: reservar capacidad en una AZ, sin descuento.</li></ul>`],
 ["Familias de instancias EC2", `<ul><li><b>Propósito general</b> (M, T): equilibrado, web.</li><li><b>Optimizadas para cómputo</b> (C): procesamiento por lotes, juegos, HPC.</li><li><b>Optimizadas para memoria</b> (R, X): bases de datos en memoria.</li><li><b>Cómputo acelerado</b> (P, G, Inf, Trn): GPU, ML.</li><li><b>Optimizadas para almacenamiento</b> (I, D): alto IOPS local, data warehouses.</li></ul>`],
 ["Planes de soporte (2026)", `<p>Los planes actuales son <b>Basic</b> (gratis) → <b>Business Support+</b> (desde $29/mes) → <b>Enterprise Support</b> (desde $5,000/mes) → <b>Unified Operations</b> (precio a medida). Developer, Business y Enterprise On-Ramp se descontinúan el 1 de enero de 2027. Por si el examen todavía usa los nombres antiguos: <b>TAM</b> = Enterprise; <b>todos los checks de Trusted Advisor</b> = desde Business; <b>&lt;15 min</b> = Enterprise.</p><table><tr><th></th><th>Basic</th><th>Business+</th><th>Enterprise</th><th>Unified Ops</th></tr><tr><td>Soporte técnico 24/7 (teléfono, chat, email)</td><td>❌ solo facturación y cuenta</td><td>✅</td><td>✅</td><td>✅</td></tr><tr><td>Trusted Advisor</td><td>Checks básicos</td><td>Todos</td><td>Todos</td><td>Todos</td></tr><tr><td>Caída crítica del negocio</td><td>—</td><td>&lt;30 min</td><td><b>&lt;15 min</b></td><td><b>&lt;5 min</b></td></tr><tr><td>Producción caída</td><td>—</td><td>&lt;1 h</td><td>&lt;1 h</td><td>&lt;1 h</td></tr><tr><td>TAM designado</td><td>❌</td><td>❌</td><td>✅</td><td>✅ + Domain Specialist Engineers</td></tr><tr><td>AWS Support API / software de terceros</td><td>❌</td><td>✅</td><td>✅</td><td>✅</td></tr></table>`],
 ["Pistas de precios", `<ul><li>En general: pagas por <b>cómputo</b>, <b>almacenamiento</b> y <b>transferencia de datos de SALIDA</b>. La entrada de datos y la transferencia dentro de la misma AZ (con IP privada) suelen ser gratuitas.</li><li>TCO (costo total de propiedad): incluye servidores, energía, refrigeración, personal e instalaciones.</li><li>IAM, VPC, CloudFormation, Auto Scaling y Elastic Beanstalk no cuestan por sí mismos; pagas los recursos que crean.</li></ul>`],

<script>
// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d){ try { const v = localStorage.getItem('clf_' + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('clf_' + k, JSON.stringify(v)); } catch(e){} }
};
let done = new Set(store.get('done', []));
const saveDone = () => { store.set('done', [...done]); updateProgress(); };

const ALL = [];
CATEGORIAS.forEach(c => c.servicios.forEach(([n, d, h]) => ALL.push({ cat: c.id, catName: c.nombre, icon: c.icono, name: n, desc: d, hint: h })));

function updateProgress(){
  const n = ALL.filter(s => done.has(s.name)).length;
  $('#prog').textContent = n + '/' + ALL.length;
  $('#progbar').style.width = (100 * n / ALL.length) + '%';
}

// ---------- estado ----------
const state = { tab: store.get('tab', 'servicios'), q: '', cat: 'all', pending: false };

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; store.set('tab', state.tab); render(); window.scrollTo(0,0); });

function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  ({ conceptos: renderConceptos, servicios: renderServicios, comparaciones: renderComparaciones, flash: renderFlash, quiz: renderQuiz })[state.tab]();
}

function catChips(selected, onPick, extra = ''){
  return `<div class="chips">${extra}<button class="chip ${selected==='all'?'on':''}" data-c="all">Todas</button>` +
    CATEGORIAS.map(c => `<button class="chip ${selected===c.id?'on':''}" data-c="${c.id}">${c.icono} ${c.nombre}</button>`).join('') + `</div>`;
}
function bindChips(onPick){ document.querySelectorAll('.chip[data-c]').forEach(b => b.onclick = () => onPick(b.dataset.c)); }

// ---------- Conceptos ----------
function renderConceptos(){
  $('#app').innerHTML = `<p class="meta" style="text-align:left">Temas que no son servicios, pero que valen muchos puntos (sobre todo en los dominios 1, 2 y 4).</p>` +
    CONCEPTOS.map(([t, h], i) => `<details class="concept" ${i < 2 ? 'open' : ''}><summary>${t}</summary><div class="body">${h}</div></details>`).join('') +
    `<div class="row"><button class="btn" id="openAll">Abrir todo</button><button class="btn" id="closeAll">Cerrar todo</button></div>`;
  $('#openAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
  $('#closeAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
}

// ---------- Servicios ----------
function hl(text, q){
  if (!q) return esc(text);
  const t = esc(text), nt = norm(t), nq = norm(esc(q));
  const i = nt.indexOf(nq);
  return i < 0 ? t : t.slice(0, i) + '<mark>' + t.slice(i, i + nq.length) + '</mark>' + t.slice(i + nq.length);
}
function renderServicios(){
  $('#app').innerHTML = `
    <div class="tools">
      <input type="search" id="q" placeholder="Buscar servicio o palabra clave (ej. PII, DDoS, Kubernetes, SQL)…" value="${esc(state.q)}">
      <label class="toggle"><input type="checkbox" id="pend" ${state.pending?'checked':''}> Solo pendientes</label>
    </div>
    ${catChips(state.cat)}
    <div id="list"></div>`;
  const q = $('#q');
  q.oninput = () => { state.q = q.value; drawList(); };
  $('#pend').onchange = e => { state.pending = e.target.checked; drawList(); };
  bindChips(c => { state.cat = c; renderServicios(); });
  drawList();
}
function drawList(){
  const nq = norm(state.q.trim());
  let html = '';
  CATEGORIAS.forEach(c => {
    if (state.cat !== 'all' && state.cat !== c.id) return;
    const items = ALL.filter(s => s.cat === c.id)
      .filter(s => !nq || norm(s.name + ' ' + s.desc + ' ' + s.hint).includes(nq))
      .filter(s => !state.pending || !done.has(s.name));
    if (!items.length) return;
    html += `<h2>${c.icono} ${c.nombre} <span class="count">${items.length}</span></h2><div class="grid">` +
      items.map(s => `<div class="svc ${done.has(s.name)?'done':''}">
        <button class="check" title="Marcar como dominado" data-n="${esc(s.name)}">${done.has(s.name)?'✓':''}</button>
        <h3>${hl(s.name, state.q.trim())}</h3><p>${hl(s.desc, state.q.trim())}</p>
        <div class="hint"><b>En el examen:</b> ${hl(s.hint, state.q.trim())}</div></div>`).join('') + `</div>`;
  });
  $('#list').innerHTML = html || `<div class="empty">Sin resultados.</div>`;
  document.querySelectorAll('.check').forEach(b => b.onclick = () => {
    const n = b.dataset.n; done.has(n) ? done.delete(n) : done.add(n); saveDone(); drawList();
  });
}

// ---------- Comparaciones ----------
function renderComparaciones(){
  $('#app').innerHTML = `<div class="tools"><input type="search" id="cq" placeholder="Filtrar comparaciones (ej. S3, Shield, costos)…"></div><div id="cmps"></div>`;
  const draw = () => {
    const nq = norm($('#cq').value.trim());
    $('#cmps').innerHTML = COMPARACIONES.filter(([t, h, r]) => !nq || norm(t + ' ' + h.join(' ') + ' ' + r.flat().join(' ')).includes(nq))
      .map(([t, h, rows, note]) => `<div class="cmp"><h3>${t}</h3><table><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>` +
        rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('') + `</table>${note ? `<p class="note">💡 ${note}</p>` : ''}</div>`).join('')
      || `<div class="empty">Sin resultados.</div>`;
  };
  $('#cq').oninput = draw; draw();
}

// ---------- Mazo (flashcards y quiz) ----------
function buildDeck(cat){
  let d = ALL.filter(s => cat === 'all' || s.cat === cat).map(s => ({ q: s.hint, a: s.name, d: s.desc, cat: s.cat }));
  if (cat === 'all' || cat === 'concepts') d = d.concat(EXTRA_CARDS.map(([q, a]) => ({ q, a, d: '', cat: 'concepts' })));
  if (cat === 'concepts') d = d.filter(x => x.cat === 'concepts');
  return d;
}
const deckChips = sel => `<div class="chips"><button class="chip ${sel==='all'?'on':''}" data-c="all">Todo</button><button class="chip ${sel==='concepts'?'on':''}" data-c="concepts">📘 Conceptos y escenarios</button>` +
  CATEGORIAS.map(c => `<button class="chip ${sel===c.id?'on':''}" data-c="${c.id}">${c.icono} ${c.nombre}</button>`).join('') + `</div>`;

// ---------- Flashcards ----------
const fs = { cat: 'all', deck: [], i: 0, known: 0, review: 0 };
function startFlash(cat){ fs.cat = cat; fs.deck = shuffle(buildDeck(cat)); fs.i = 0; fs.known = 0; fs.review = 0; }
function renderFlash(){
  if (!fs.deck.length) startFlash(fs.cat);
  const total = fs.deck.length;
  if (fs.i >= total){
    $('#app').innerHTML = deckChips(fs.cat) + `<div class="flash"><div class="qbox" style="text-align:center"><div class="q">🎉 ¡Mazo terminado!</div>
      <p>Las sabías: <b>${fs.known}</b> · Para repasar: <b>${fs.review}</b></p><div class="row"><button class="btn primary" id="again">Barajar de nuevo</button></div></div></div>`;
    $('#again').onclick = () => { startFlash(fs.cat); renderFlash(); };
    bindChips(c => { startFlash(c); renderFlash(); });
    return;
  }
  const c = fs.deck[fs.i];
  $('#app').innerHTML = deckChips(fs.cat) + `
    <div class="flash">
      <div class="card" id="card"><div class="inner">
        <div class="face"><span class="lbl">Escenario · ${fs.i + 1}/${total}</span><div class="q">${esc(c.q)}</div><div class="d">Toca para ver la respuesta</div></div>
        <div class="face back"><span class="lbl">Respuesta</span><div class="a">${esc(c.a)}</div>${c.d ? `<div class="d">${esc(c.d)}</div>` : ''}</div>
      </div></div>
      <div class="row">
        <button class="btn bad" id="no">↺ Repasar</button>
        <button class="btn" id="flip">Voltear (espacio)</button>
        <button class="btn ok" id="yes">✓ La sabía</button>
      </div>
      <div class="meta">Las que marques como "Repasar" vuelven a salir al final del mazo · sabías ${fs.known} · por repasar ${fs.review}</div>
    </div>`;
  const card = $('#card');
  const flip = () => card.classList.toggle('flipped');
  card.onclick = flip; $('#flip').onclick = flip;
  $('#yes').onclick = () => { fs.known++; fs.i++; renderFlash(); };
  $('#no').onclick = () => { fs.review++; fs.deck.push(c); fs.i++; renderFlash(); };
  bindChips(cc => { startFlash(cc); renderFlash(); });
}

// ---------- Quiz ----------
const qz = { cat: 'all', items: [], i: 0, ok: 0, answered: false, n: 20 };
function startQuiz(cat){
  qz.cat = cat; qz.i = 0; qz.ok = 0; qz.answered = false; qz.fails = [];
  const pool = buildDeck(cat);
  const all = buildDeck('all');
  qz.items = shuffle(pool).slice(0, qz.n).map(card => {
    let same = shuffle(all.filter(x => x.cat === card.cat && x.a !== card.a)).map(x => x.a);
    let other = shuffle(all.filter(x => x.a !== card.a)).map(x => x.a);
    const opts = [...new Set([...same, ...other])].slice(0, 3);
    return { ...card, opts: shuffle([card.a, ...opts]) };
  });
}
function renderQuiz(){
  if (!qz.items.length) startQuiz(qz.cat);
  const head = deckChips(qz.cat) + `<div class="tools" style="justify-content:center">Preguntas: <select id="qn">${[10,20,30,50,999].map(n => `<option value="${n}" ${qz.n===n?'selected':''}>${n===999?'Todas':n}</option>`).join('')}</select></div>`;
  if (qz.i >= qz.items.length){
    const pct = Math.round(100 * qz.ok / qz.items.length);
    $('#app').innerHTML = head + `<div class="quiz"><div class="qbox" style="text-align:center"><div class="q">${pct >= 70 ? '✅' : '📚'} ${qz.ok}/${qz.items.length} (${pct}%)</div>
      <p>${pct >= 70 ? '¡Por encima del 70% de referencia para aprobar!' : 'Repasa las falladas y vuelve a intentarlo.'}</p>
      ${qz.fails.length ? `<table><tr><th>Escenario</th><th>Respuesta</th></tr>${qz.fails.map(f => `<tr><td>${esc(f.q)}</td><td><b>${esc(f.a)}</b></td></tr>`).join('')}</table>` : ''}
      <div class="row"><button class="btn primary" id="again">Nuevo quiz</button></div></div></div>`;
    $('#again').onclick = () => { startQuiz(qz.cat); renderQuiz(); };
  } else {
    const it = qz.items[qz.i];
    $('#app').innerHTML = head + `<div class="quiz"><div class="score">Pregunta ${qz.i + 1}/${qz.items.length} · Aciertos: ${qz.ok}</div>
      <div class="qbox"><div class="q">${esc(it.q)}</div>
      ${it.opts.map((o, k) => `<button class="opt" data-k="${k}">${String.fromCharCode(65 + k)}. ${esc(o)}</button>`).join('')}
      <div id="exp"></div></div></div>`;
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (qz.answered) return; qz.answered = true;
      const pick = it.opts[+b.dataset.k];
      document.querySelectorAll('.opt').forEach(x => { if (it.opts[+x.dataset.k] === it.a) x.classList.add('right'); });
      if (pick === it.a) qz.ok++; else { b.classList.add('wrong'); qz.fails.push(it); }
      $('#exp').innerHTML = `${it.d ? `<div class="explain"><b>${esc(it.a)}:</b> ${esc(it.d)}</div>` : ''}<div class="row"><button class="btn primary" id="next">Siguiente →</button></div>`;
      $('#next').onclick = () => { qz.i++; qz.answered = false; renderQuiz(); };
      $('#next').focus();
    });
  }
  $('#qn').onchange = e => { qz.n = +e.target.value; startQuiz(qz.cat); renderQuiz(); };
  bindChips(c => { startQuiz(c); renderQuiz(); });
}

// atajos de teclado
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (state.tab === 'flash'){
    if (e.code === 'Space'){ e.preventDefault(); $('#card') && $('#card').classList.toggle('flipped'); }
    if (e.key === 'ArrowRight') $('#yes') && $('#yes').click();
    if (e.key === 'ArrowLeft') $('#no') && $('#no').click();
  }
  if (state.tab === 'quiz' && !qz.answered && /^[1-4a-dA-D]$/.test(e.key)){
    const k = isNaN(+e.key) ? e.key.toUpperCase().charCodeAt(0) - 65 : +e.key - 1;
    const b = document.querySelector(`.opt[data-k="${k}"]`); b && b.click();
  }
});

updateProgress();
render();
</script>
</body>
